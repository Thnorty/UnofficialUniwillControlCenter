[package]
name = "unofficial-uniwill-control-center"
version = "3.5.0"
edition = "2024"
description = "Lighting, performance modes, fans and battery care for laptops built by Uniwill"
publish = false

[[bin]]
name = "UnofficialUniwillControlCenter"
path = "src/main.rs"

# The terminal command: talks to the running app over its pipe (src/cli).
[[bin]]
name = "uucc"
path = "src/bin/uucc/main.rs"

# Linux only: the root helper the app reaches the EC and the BIOS variable through (src/bin/uucc-helper).
[[bin]]
name = "uucc-helper"
path = "src/bin/uucc-helper/main.rs"

[dependencies]
anyhow = "1.0"
raw-window-handle = "0.6"
rhai = { version = "1.26", features = ["serde", "no_module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
slint = { version = "1.18.1", features = ["raw-window-handle-06", "renderer-skia"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libloading = "0.9"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
zbus = "5"

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0"
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"

# The Linux packages (scripts/build-linux.sh): the app, uucc, the root helper with its systemd units and polkit
# action, and the udev rule for the lighting controllers.
[package.metadata.deb]
maintainer = "Thnorty <ototatik@gmail.com>"
extended-description = "Keyboard and light bar lighting, performance modes, fans, battery care and a hardware monitor for laptops built by Uniwill, with a small root helper (uucc-helper) for the embedded controller."
section = "utils"
priority = "optional"
depends = "$auto, libfontconfig1, libxkbcommon0, polkitd | policykit-1, systemd, kdialog | zenity"
maintainer-scripts = "packaging/linux/"
assets = [
    ["target/release/UnofficialUniwillControlCenter", "usr/bin/unofficial-uniwill-control-center", "755"],
    ["target/release/uucc", "usr/bin/uucc", "755"],
    ["target/release/uucc-helper", "usr/libexec/uucc-helper", "755"],
    ["packaging/linux/uucc-helper.socket", "usr/lib/systemd/system/uucc-helper.socket", "644"],
    ["packaging/linux/uucc-helper.service", "usr/lib/systemd/system/uucc-helper.service", "644"],
    ["packaging/linux/io.github.thnorty.uucc.policy", "usr/share/polkit-1/actions/io.github.thnorty.uucc.policy", "644"],
    ["packaging/linux/70-uucc-lighting.rules", "usr/lib/udev/rules.d/70-uucc-lighting.rules", "644"],
    ["packaging/linux/unofficial-uniwill-control-center.desktop", "usr/share/applications/unofficial-uniwill-control-center.desktop", "644"],
    ["res/app.png", "usr/share/icons/hicolor/256x256/apps/unofficial-uniwill-control-center.png", "644"],
]

[package.metadata.generate-rpm]
# RPM needs a license field; the repository has none chosen yet, which means all rights reserved.
license = "All rights reserved"
summary = "Lighting, performance modes, fans and battery care for laptops built by Uniwill"
post_install_script = "packaging/linux/postinst"
pre_uninstall_script = "packaging/linux/prerm"
post_uninstall_script = "packaging/linux/postrm"
assets = [
    { source = "target/release/UnofficialUniwillControlCenter", dest = "/usr/bin/unofficial-uniwill-control-center", mode = "755" },
    { source = "target/release/uucc", dest = "/usr/bin/uucc", mode = "755" },
    { source = "target/release/uucc-helper", dest = "/usr/libexec/uucc-helper", mode = "755" },
    { source = "packaging/linux/uucc-helper.socket", dest = "/usr/lib/systemd/system/uucc-helper.socket", mode = "644" },
    { source = "packaging/linux/uucc-helper.service", dest = "/usr/lib/systemd/system/uucc-helper.service", mode = "644" },
    { source = "packaging/linux/io.github.thnorty.uucc.policy", dest = "/usr/share/polkit-1/actions/io.github.thnorty.uucc.policy", mode = "644" },
    { source = "packaging/linux/70-uucc-lighting.rules", dest = "/usr/lib/udev/rules.d/70-uucc-lighting.rules", mode = "644" },
    { source = "packaging/linux/unofficial-uniwill-control-center.desktop", dest = "/usr/share/applications/unofficial-uniwill-control-center.desktop", mode = "644" },
    { source = "res/app.png", dest = "/usr/share/icons/hicolor/256x256/apps/unofficial-uniwill-control-center.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
libxkbcommon = "*"
polkit = "*"
systemd = "*"
"(kdialog or zenity)" = ""
