[package]
name = "unofficial-uniwill-control-center"
version = "3.4.0"
edition = "2024"
description = "Lighting, performance modes, fans and battery care for laptops built by Uniwill"
publish = false

[[bin]]
name = "UnofficialUniwillControlCenter"
path = "src/main.rs"

# The terminal command: talks to the running app over its pipe (src/cli).
[[bin]]
name = "uucc"
path = "src/bin/uucc/main.rs"

# Linux only: the root helper the app reaches the EC and the BIOS variable through (src/bin/uucc-helper).
[[bin]]
name = "uucc-helper"
path = "src/bin/uucc-helper/main.rs"

[dependencies]
anyhow = "1.0"
raw-window-handle = "0.6"
rhai = { version = "1.26", features = ["serde", "no_module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
slint = { version = "1.18.1", features = ["raw-window-handle-06", "renderer-skia"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0"
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
